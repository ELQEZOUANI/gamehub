name: gameapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  vibration: ^1.9.0
  path_provider: ^2.1.2
  google_mobile_ads: ^9.1.0
  url_launcher: ^6.3.2
  app_tracking_transparency: ^2.0.7
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/memory/
    - assets/appicon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/appicon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/appicon.png
    background_color: '#10182D'
    theme_color: '#10182D'
  windows:
    generate: true
    image_path: assets/appicon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/appicon.png
  
